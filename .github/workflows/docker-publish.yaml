name: docker-publish.yaml

# Reusable: builds the puzzleapp image from the tarball artifact produced by
# the `release` job in R-CMD-check.yaml and pushes it to GHCR. Called with
# secrets: inherit, so it needs its own job-level permissions (a called
# workflow can only narrow what the caller job grants, never widen it).
on:
  workflow_call:
    inputs:
      git_ref:
        description: "Tag being released (e.g. v0.3.0); the leading v is stripped for the image tag."
        required: true
        type: string

jobs:
  docker-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: puzzleapp-tarball

      - name: Compute image name and version
        run: |
          version="${{ inputs.git_ref }}"
          version="${version#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/puzzleapp" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
