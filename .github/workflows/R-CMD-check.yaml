# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# don't run on every push; only on PRs and pushes to default branch or tags
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          - {os: macos-latest,   r: '4.4.2'}
          - {os: windows-latest, r: '4.4.2'}
          - {os: ubuntu-latest,   r: '4.4.2'} # works because igvshiny is in Bioconductor since 3.19 (R-4.4)
          # - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'} # devel builds faild dueo to bioconductor issues VariantAnnotation not available yet?
          # - {os: ubuntu-latest,   r: '4.1.3'} # fails because igvshiny not in Bioconductor 3.14
          # - {os: ubuntu-latest,   r: '4.2.3'} # fails because igvshiny not in Bioconductor 3.16
          # - {os: ubuntu-latest,   r: '4.3.3'} # fails because igvshiny not in Bioconductor 3.18

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # On a v* tag, publish the release and attach the R source tarball.
  # `needs` means nothing is published unless every check job above passed.
  # The tarball is what the if89/ABLeS install.sh downloads, so its name must
  # stay puzzleapp_<version>.tar.gz.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: R-CMD-check
    runs-on: ubuntu-latest

    # Job-level permissions replace the workflow-level read-all for this job.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # puzzleapp has no vignettes and no compiled code, so building the
      # tarball needs neither pandoc nor the dependency tree.
      - name: Check DESCRIPTION version matches the tag
        run: |
          ver=$(grep '^Version:' DESCRIPTION | tr -d ' ' | cut -d: -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "DESCRIPTION Version ($ver) does not match tag ($tag)" >&2
            exit 1
          fi

      - name: Build source tarball
        run: R CMD build --no-build-vignettes .

      - name: Create release and attach tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "puzzleapp-$GITHUB_REF_NAME" \
            --generate-notes \
            puzzleapp_*.tar.gz
