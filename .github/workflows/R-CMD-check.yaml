# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: []
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'} # devel builds faild dueo to bioconductor issues
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          - {os: macos-latest,   r: '4.4.2'}
          - {os: windows-latest, r: '4.4.2'}
          - {os: ubuntu-latest,   r: '4.4.2'} # works because igvshiny is in Bioconductor since 3.19 (R-4.4)
          # - {os: ubuntu-latest,   r: '4.1.3'} # fails because igvshiny not in Bioconductor 3.14
          # - {os: ubuntu-latest,   r: '4.2.3'} # fails because igvshiny not in Bioconductor 3.16
          # - {os: ubuntu-latest,   r: '4.3.3'} # fails because igvshiny not in Bioconductor 3.18

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
# New: dedicated Bioconductor devel job in Bioc's official container
  R-CMD-check-bioc-devel:
    name: ubuntu-latest (R devel via Bioc container)
    runs-on: ubuntu-latest
    # Use Bioconductor's R-devel container. It includes the right Bioc repos.
    container: bioconductor/bioconductor_docker:devel

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2

      # No setup-r needed; container already has R-devel.
      # Set CRAN mirror to a fast one; Bioc repos are already configured in the container.
      - name: Configure CRAN mirror
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          print(getOption("repos"))

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
