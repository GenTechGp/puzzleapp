# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: []
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          - {os: macos-latest,   r: '4.4.2'}
          - {os: windows-latest, r: '4.4.2'}
          - {os: ubuntu-latest,   r: '4.4.2'} # works because igvshiny is in Bioconductor since 3.19 (R-4.4)
          # - {os: ubuntu-latest,   r: '4.1.3'} # fails because igvshiny not in Bioconductor 3.14
          # - {os: ubuntu-latest,   r: '4.2.3'} # fails because igvshiny not in Bioconductor 3.16
          # - {os: ubuntu-latest,   r: '4.3.3'} # fails because igvshiny not in Bioconductor 3.18

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Devel-only: configure Bioconductor repos
      - name: Configure Bioconductor repositories (devel only)
        if: ${{ matrix.config.r == 'devel' }}
        shell: Rscript {0}
        run: |
          if (!requireNamespace("BiocManager", quietly = TRUE)) {
            install.packages("BiocManager", repos = "https://cloud.r-project.org")
          }
          repos <- BiocManager::repositories()
          # Collapse deparse output to one line to avoid a broken .Rprofile
          expr <- sprintf("options(repos = %s)", paste(deparse(repos), collapse = ""))
          cat(expr, "\n", file = ".Rprofile")

      - name: Enable .Rprofile for subsequent steps (devel only)
        if: ${{ matrix.config.r == 'devel' }}
        run: echo "R_PROFILE_USER=${GITHUB_WORKSPACE}/.Rprofile" >> $GITHUB_ENV

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
