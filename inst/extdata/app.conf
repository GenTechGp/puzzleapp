# Configuration file for the Shiny app
#
# These are portable defaults only. This file lives inside the installed
# package, so do not edit it to point at a machine-specific location — use one
# of the two overrides instead.
#
# For one user or one session, set an R option in ~/.Rprofile or before
# calling run_app():
#
#   options(puzzleapp.panelapp_db_dir  = "/g/data/.../db/panelapp")
#   options(puzzleapp.phenotype_db_dir = "/g/data/.../db/phenotype")
#
# For a site-wide install, set an environment variable. A Unix modulefile
# cannot set an R option, so this is what a shared deployment uses:
#
#   PUZZLEAPP_PANELAPP_DB_DIR=/g/data/.../db/panelapp
#   PUZZLEAPP_PHENOTYPE_DB_DIR=/g/data/.../db/phenotype
#
# Precedence is option > environment variable > the value here, so a user can
# always override whatever a module set for them. Paths may be absolute,
# ~/-relative, or relative to the installed package directory. The resolved
# location is logged when it is read, so it is always clear which source was
# used.

# record for panelapp database dir location
panelapp_db_dir = "~/.puzzleapp/panelapp"
# record for phenotype database dir location
phenotype_db_dir = "~/.puzzleapp/phenotype"
# record for VEP consequences database dir location (this is within the package extdata directory)
vep_consequences_db_dir = "extdata/db/vep_consequences"
